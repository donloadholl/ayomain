<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten Riset AI Studio 21</title>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: sans-serif; margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #0f172a, #1e1b4b); padding: 30px 15px; text-align: center; border-bottom: 2px solid #3b82f6; }
        .header h1 { margin: 0; font-size: 24px; color: #38bdf8; }
        .header p { margin: 8px 0 0 0; font-size: 13px; color: #9ca3af; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        @media(min-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        .ai-card { background: #111827; border-radius: 8px; overflow: hidden; border: 1px solid #1f2937; padding-bottom: 10px; }
        .image-box { position: relative; width: 100%; padding-top: 100%; background: #000; }
        .image-box img { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; }
        .category-badge { position: absolute; top: 8px; right: 8px; background: #2563eb; color: white; padding: 3px 8px; font-size: 9px; font-weight: bold; border-radius: 4px; }
        .ai-info { padding: 12px 10px; text-align: center; }
        .ai-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #38bdf8; }
        .prompt-box { width: 90%; height: 50px; background: #1f2937; color: #e5e7eb; border: 1px solid #374151; border-radius: 4px; padding: 5px; font-size: 11px; font-family: monospace; resize: none; cursor: pointer; text-align: left; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI STUDIO 21 - PRIVATE PANEL</h1>
        <p>📋 Klik pada kotak text di bawah gambar untuk menyalin prompt secara instan.</p>
    </div>
    <div class="container"><div class="grid">
    <div class="ai-card">
        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1618005198143-e5283b519a7f?w=400" alt="Abstract">
            <span class="category-badge">ABSTRACT</span>
        </div>
        <div class="ai-info">
            <div class="ai-title">Abstract Liquid Gold</div>
            <textarea class="prompt-box" readonly onclick="this.select(); document.execCommand('copy'); alert('Prompt berhasil disalin!');">abstract liquid gold wave, fluid motion, premium background, high quality, 8k resolution</textarea>
        </div>
    </div>
    </div></div>
</body>
</html>
